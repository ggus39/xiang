baseURL = "https://ggus39.github.io/xiang/"
languageCode = "zh-cn"
title = "Xiang · 想"
theme = "PaperMod"

[params]
    env = "production"
    description = "一个长期公开的个人思考档案。记录想法、对话、阅读、工作与认知变化。"
    defaultTheme = "auto"
    DateFormat = "2006年01月02日"
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowPostNavLinks = true
    ShowCodeCopyButtons = true
    mainSections = ["thoughts", "ai", "reading", "work", "finance", "journals", "posts", "Excerpt", "habits"]

[params.homeInfoParams]
    Title = "Xiang · 想"
    Content = "记录想法、对话和变化。这里不追求高频更新、热点或标准答案，更想留下一个人的认知是怎样慢慢发生变化的。"

