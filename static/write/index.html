<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#fafaf7">
  <title>手机写作 - 如此小生</title>
  <style>
    :root {
      --bg: #fafaf7;
      --panel: #ffffff;
      --text: #252522;
      --muted: #707068;
      --line: #e5e2da;
      --soft: #f4f3ee;
      --accent: #2f5f8f;
      --danger: #a33a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 22px 18px 44px;
    }

    header { padding: 10px 0 18px; }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 14px 34px rgba(42, 39, 31, 0.07);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      letter-spacing: 0;
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 280px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 95, 143, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .inline-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .inline-check input { width: auto; }

    .inline-check.compact {
      margin-top: 8px;
      font-size: 13px;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      text-decoration: none;
      padding: 10px 12px;
    }

    button:disabled { opacity: 0.65; }

    button.secondary,
    a.button.secondary {
      background: var(--soft);
      border-color: var(--line);
      color: var(--text);
    }

    .preview {
      margin-top: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      color: var(--muted);
      font-family: Consolas, "Microsoft YaHei", monospace;
      font-size: 13px;
      max-height: 260px;
      overflow: auto;
    }

    .status {
      min-height: 26px;
      margin-top: 12px;
      color: var(--accent);
      font-size: 14px;
    }

    .status.error { color: var(--danger); }

    @media (max-width: 560px) {
      .grid,
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>手机写作</h1>
      <p>选板块、套模板，可以复制 Markdown，也可以用 Token 直接发布到 GitHub。</p>
    </header>

    <section class="panel">
      <div class="grid">
        <div>
          <label for="section">板块</label>
          <select id="section">
            <option value="thoughts">想法</option>
            <option value="posts">记录</option>
            <option value="habits">习惯</option>
            <option value="Excerpt">摘句</option>
            <option value="journals">周月记</option>
          </select>
        </div>
        <div>
          <label for="date">日期时间</label>
          <input id="date" type="datetime-local">
          <label class="inline-check compact" for="liveDate">
            <input id="liveDate" type="checkbox" checked>
            <span>使用实时当前时间</span>
          </label>
        </div>
      </div>

      <label for="template">写作模板</label>
      <select id="template">
        <option value="auto">跟随板块</option>
        <option value="thoughts">想法模板</option>
        <option value="posts">记录模板</option>
        <option value="habits">习惯模板</option>
        <option value="Excerpt">摘句模板</option>
        <option value="journals">周月记模板</option>
        <option value="blank">空白正文</option>
      </select>

      <label for="title">标题</label>
      <input id="title" type="text" placeholder="写一个标题">

      <label for="filename">文件名</label>
      <input id="filename" type="text" placeholder="例如 2026.7.5.md">

      <label for="token">GitHub Token</label>
      <input id="token" type="password" autocomplete="off" placeholder="只保存在本机浏览器，用于直接发布">
      <p class="hint">Token 需要能写入 ggus39/xiang 仓库内容。不要把 Token 发给别人。</p>

      <label class="inline-check" for="noIndent">
        <input id="noIndent" type="checkbox">
        <span>这篇不首行缩进</span>
      </label>

      <label for="content">正文</label>
      <textarea id="content" placeholder="从这里开始写..."></textarea>

      <div class="actions">
        <button id="applyTemplate" class="secondary" type="button">套用模板</button>
        <button id="copy" class="secondary" type="button">复制 Markdown</button>
        <button id="publish" type="button">直接发布</button>
        <a id="github" class="button secondary" href="https://github.com/ggus39/xiang/new/main/content/thoughts" target="_blank" rel="noopener">打开 GitHub</a>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
      <pre id="preview" class="preview"></pre>
    </section>
  </main>

  <script>
    const repoBase = "https://github.com/ggus39/xiang/new/main/content/";
    const repoApiBase = "https://api.github.com/repos/ggus39/xiang/contents/";
    const branch = "main";

    const templates = {
      thoughts: {
        title: "一个小想法",
        noIndent: false,
        body: "这里写第一段想法。\n\n这里写第二段。想分段就空一行。\n\n### 脑子里反复想到\n\n\n### 现在的感觉\n\n\n### 可以先做的小事\n"
      },
      posts: {
        title: "今天的记录",
        noIndent: false,
        body: "这里写今天的第一段记录。\n\n这里写第二段。想分段就空一行。\n\n### 今天做了\n\n\n### 现在感觉\n\n\n### 脑子里反复想到\n\n\n### 明天做\n"
      },
      habits: {
        title: "习惯复盘",
        noIndent: false,
        body: "### 今天完成了什么\n\n\n### 没做到的原因\n\n\n### 明天的最小动作\n\n\n### 一句话复盘\n"
      },
      Excerpt: {
        title: "小摘",
        noIndent: true,
        body: "> 这里写摘录的句子。\n\n来源：\n\n我的想法：\n"
      },
      journals: {
        title: "周记",
        noIndent: false,
        body: "## 本周概览\n\n\n## 工作/学习\n\n\n## 运动和作息\n\n\n## 情绪状态\n\n\n## 下周想做什么\n"
      },
      blank: {
        title: "",
        noIndent: false,
        body: ""
      }
    };

    const fields = {
      section: document.getElementById("section"),
      date: document.getElementById("date"),
      liveDate: document.getElementById("liveDate"),
      template: document.getElementById("template"),
      title: document.getElementById("title"),
      filename: document.getElementById("filename"),
      token: document.getElementById("token"),
      noIndent: document.getElementById("noIndent"),
      content: document.getElementById("content"),
      preview: document.getElementById("preview"),
      status: document.getElementById("status"),
      github: document.getElementById("github"),
      copy: document.getElementById("copy"),
      publish: document.getElementById("publish"),
      applyTemplate: document.getElementById("applyTemplate")
    };

    function setStatus(message, isError = false) {
      fields.status.textContent = message;
      fields.status.classList.toggle("error", isError);
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function localDateValue(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function defaultFileName(date) {
      return `${date.getFullYear()}.${date.getMonth() + 1}.${date.getDate()}.md`;
    }

    function normalizeFileName(value) {
      const cleaned = value.trim().replace(/^\/+/, "").replace(/\\/g, "/").split("/").pop();
      const fallback = defaultFileName(new Date());
      const name = cleaned || fallback;
      return name.endsWith(".md") ? name : `${name}.md`;
    }

    function escapeTitle(value) {
      return value.replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
    }

    function isoWithChinaOffset(value) {
      const date = value ? new Date(value) : new Date();
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:00+08:00`;
    }

    function currentTemplateKey() {
      return fields.template.value === "auto" ? fields.section.value : fields.template.value;
    }

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function toBase64Utf8(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return btoa(binary);
    }

    async function githubJson(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (error) {}
      if (!response.ok) {
        throw new Error(data.message || `HTTP ${response.status}`);
      }
      return data;
    }

    function buildMarkdown() {
      const title = fields.title.value.trim() || "未命名";
      const content = fields.content.value.trim();
      const noIndentLine = fields.noIndent.checked ? "noIndent: true\n" : "";
      return `---\ntitle:  "${escapeTitle(title)}"\ndate: ${isoWithChinaOffset(fields.date.value)}\ndraft: false\n${noIndentLine}---\n\n${content}\n`;
    }

    function update() {
      const date = fields.date.value ? new Date(fields.date.value) : new Date();
      if (!fields.filename.value.trim()) fields.filename.value = defaultFileName(date);
      fields.github.href = repoBase + encodeURIComponent(fields.section.value);
      fields.preview.textContent = buildMarkdown();
      localStorage.setItem("xiang-writer", JSON.stringify({
        section: fields.section.value,
        date: fields.date.value,
        liveDate: fields.liveDate.checked,
        template: fields.template.value,
        title: fields.title.value,
        filename: fields.filename.value,
        noIndent: fields.noIndent.checked,
        content: fields.content.value
      }));
    }

    function applySelectedTemplate() {
      const item = templates[currentTemplateKey()] || templates.blank;
      if (item.title && !fields.title.value.trim()) fields.title.value = item.title;
      fields.noIndent.checked = item.noIndent;
      fields.content.value = item.body;
      setStatus("已套用模板，可以直接改正文。");
      update();
    }

    function restore() {
      const saved = localStorage.getItem("xiang-writer");
      if (saved) {
        try {
          const data = JSON.parse(saved);
          fields.section.value = data.section || "thoughts";
          fields.liveDate.checked = data.liveDate !== false;
          fields.date.value = fields.liveDate.checked ? localDateValue(new Date()) : (data.date || localDateValue(new Date()));
          fields.template.value = data.template || "auto";
          fields.title.value = data.title || "";
          fields.filename.value = data.filename || "";
          fields.noIndent.checked = Boolean(data.noIndent);
          fields.content.value = data.content || "";
        } catch (error) {}
      } else {
        const now = new Date();
        fields.liveDate.checked = true;
        fields.date.value = localDateValue(now);
        fields.filename.value = defaultFileName(now);
        fields.noIndent.checked = false;
      }
      fields.token.value = localStorage.getItem("xiang-github-token") || "";
      update();
    }

    async function publishToGithub() {
      update();
      const token = fields.token.value.trim();
      if (!token) {
        setStatus("请先填写 GitHub Token。", true);
        return;
      }

      const fileName = normalizeFileName(fields.filename.value);
      fields.filename.value = fileName;
      const path = `content/${fields.section.value}/${fileName}`;
      const apiUrl = repoApiBase + encodePath(path);
      const headers = {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${token}`,
        "X-GitHub-Api-Version": "2022-11-28"
      };

      fields.publish.disabled = true;
      setStatus("正在发布到 GitHub...");

      try {
        localStorage.setItem("xiang-github-token", token);
        let sha;
        try {
          const existing = await githubJson(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers });
          sha = existing.sha;
        } catch (error) {
          if (!String(error.message).includes("Not Found")) throw error;
        }

        const body = {
          message: `Publish ${fileName}`,
          content: toBase64Utf8(buildMarkdown()),
          branch
        };
        if (sha) body.sha = sha;

        await githubJson(apiUrl, {
          method: "PUT",
          headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        setStatus(`发布成功：${path}。GitHub Pages 通常需要几十秒到几分钟更新。`);
      } catch (error) {
        setStatus(`发布失败：${error.message}`, true);
      } finally {
        fields.publish.disabled = false;
      }
    }


    function syncLiveDate() {
      if (!fields.liveDate.checked) return;
      fields.date.value = localDateValue(new Date());
      update();
    }

    setInterval(syncLiveDate, 30000);

    fields.liveDate.addEventListener("change", () => {
      if (fields.liveDate.checked) syncLiveDate();
      update();
    });

    fields.date.addEventListener("input", () => {
      fields.liveDate.checked = false;
      update();
    });
    fields.applyTemplate.addEventListener("click", applySelectedTemplate);
    fields.publish.addEventListener("click", publishToGithub);

    fields.section.addEventListener("change", () => {
      if (fields.template.value === "auto") fields.noIndent.checked = fields.section.value === "Excerpt";
      update();
    });

    fields.token.addEventListener("input", () => {
      const token = fields.token.value.trim();
      if (token) localStorage.setItem("xiang-github-token", token);
    });

    fields.copy.addEventListener("click", async () => {
      update();
      await navigator.clipboard.writeText(fields.preview.textContent);
      setStatus(`已复制。GitHub 新文件名填：content/${fields.section.value}/${fields.filename.value.trim() || defaultFileName(new Date())}`);
    });

    [fields.section, fields.template, fields.title, fields.filename, fields.token, fields.noIndent, fields.content].forEach((field) => {
      field.addEventListener("input", update);
      field.addEventListener("change", update);
    });

    restore();
    syncLiveDate();
  </script>
</body>
</html>
